services:
  anki-central:
    image: thisisnttheway/headless-anki:latest
    container_name: anki-central
    environment:
      QT_QPA_PLATFORM: vnc
      ANKICONNECT_WILDCARD_ORIGIN: "1"
    volumes:
      - anki-central-data:/data
      - shared-exports:/exports
    ports:
      - "8765:8765"
      - "5900:5900"  # VNC — for AnkiWeb login and debugging
    restart: unless-stopped
    mem_limit: 512m

  anki-child-1:
    image: thisisnttheway/headless-anki:latest
    container_name: anki-child-1
    environment:
      QT_QPA_PLATFORM: vnc
      ANKICONNECT_WILDCARD_ORIGIN: "1"
    volumes:
      - anki-child-1-data:/data
      - shared-exports:/exports
    ports:
      - "8766:8765"
      - "5901:5900"
    restart: unless-stopped
    mem_limit: 512m

  anki-child-2:
    image: thisisnttheway/headless-anki:latest
    container_name: anki-child-2
    environment:
      QT_QPA_PLATFORM: vnc
      ANKICONNECT_WILDCARD_ORIGIN: "1"
    volumes:
      - anki-child-2-data:/data
      - shared-exports:/exports
    ports:
      - "8767:8765"
      - "5902:5900"
    restart: unless-stopped
    mem_limit: 512m

  portal:
    build: .
    # Or use the pre-built image from Docker Hub instead of building locally:
    # image: gykpro/anki-spelling-portal:latest
    container_name: spelling-portal
    init: true
    environment:
      ANKI_CONNECT_URL: http://anki-central:8765
      DISTRIBUTION_ENDPOINTS: http://anki-child-1:8765,http://anki-child-2:8765
      EXPORT_SHARED_PATH: /exports
    volumes:
      - ./data:/app/data
      - shared-exports:/exports
    ports:
      - "3000:3000"
    depends_on:
      - anki-central
      - anki-child-1
      - anki-child-2
    restart: unless-stopped

volumes:
  anki-central-data:
  anki-child-1-data:
  anki-child-2-data:
  shared-exports:
